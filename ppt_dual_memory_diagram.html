<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:#0f172a; overflow:hidden; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="ephemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="persGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2007" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowRight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="15" y="15" width="1170" height="645" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ================= HEADER ================= -->
  <text x="600" y="52" fill="url(#headerGrad)" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="1">
    SUMMIT: DUAL-TIER DATABASE &amp; MEMORY ARCHITECTURE
  </text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" text-anchor="middle">
    Separating Ephemeral Chat Turns from Permanent Cross-Session Project Knowledge
  </text>

  <!-- ================= COLUMN 1: EPHEMERAL CONVERSATION MEMORY ================= -->
  <g transform="translate(45, 110)">
    <rect x="0" y="0" width="345" height="495" rx="14" fill="url(#ephemGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="0" y="0" width="345" height="50" rx="14" fill="#0284c7"/>
    <rect x="0" y="30" width="345" height="20" fill="#0284c7"/>
    <text x="172" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">TIER 1: CONVERSATION MEMORY</text>

    <!-- Scope Tag -->
    <rect x="25" y="65" width="295" height="30" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="172" y="85" fill="#38bdf8" font-size="11.5" font-weight="600" text-anchor="middle">Scope: Ephemeral / Active Session Chat</text>

    <!-- Table Graphic Box -->
    <rect x="20" y="110" width="305" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="20" y="110" width="305" height="34" rx="10" fill="#334155"/>
    <rect x="20" y="130" width="305" height="14" fill="#334155"/>
    <text x="35" y="133" fill="#f8fafc" font-size="13" font-weight="bold">SQLite: messages table</text>
    <text x="245" y="133" fill="#94a3b8" font-size="10.5">Raw Logs</text>

    <!-- Table Fields -->
    <text x="35" y="165" fill="#94a3b8" font-size="11 font-mono">id (UUID)  •  project_id  •  user_id</text>
    <text x="35" y="185" fill="#38bdf8" font-size="11 font-mono">role: "user" | "assistant" | "system"</text>
    <text x="35" y="205" fill="#cbd5e1" font-size="11 font-mono">content: "run pytest", "ok thanks"...</text>
    <text x="35" y="225" fill="#94a3b8" font-size="11 font-mono">created_at: Indexed Timestamp</text>
    <text x="35" y="248" fill="#f87171" font-size="10.5">⚠️ Contains 80%+ conversational noise</text>

    <!-- Key Characteristics Card -->
    <rect x="20" y="275" width="305" height="205" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="302" fill="#e2e8f0" font-size="13" font-weight="bold">Key Characteristics</text>
    <line x1="35" y1="312" x2="310" y2="312" stroke="#334155" stroke-width="1"/>
    
    <text x="35" y="336" fill="#cbd5e1" font-size="11.5">• Chronological dialogue flow</text>
    <text x="35" y="360" fill="#cbd5e1" font-size="11.5">• Sliding window context (last N turns)</text>
    <text x="35" y="384" fill="#cbd5e1" font-size="11.5">• High churn, uncurated raw tokens</text>
    <text x="35" y="408" fill="#cbd5e1" font-size="11.5">• Insufficient for long-term project rules</text>

    <!-- Badge -->
    <rect x="35" y="432" width="275" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="172" y="453" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Provides Short-Term Continuity</text>
  </g>

  <!-- ================= COLUMN 2: PERSISTENT PROJECT MEMORY ================= -->
  <g transform="translate(425, 110)">
    <rect x="0" y="0" width="350" height="495" rx="14" fill="url(#persGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="0" y="0" width="350" height="50" rx="14" fill="#b45309"/>
    <rect x="0" y="30" width="350" height="20" fill="#b45309"/>
    <text x="175" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">TIER 2: PERSISTENT PROJECT MEMORY</text>

    <!-- Scope Tag -->
    <rect x="25" y="65" width="300" height="30" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="175" y="85" fill="#fbbf24" font-size="11.5" font-weight="600" text-anchor="middle">Scope: Permanent / Survives All Restarts</text>

    <!-- Table Graphic Box -->
    <rect x="20" y="110" width="310" height="150" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <rect x="20" y="110" width="310" height="34" rx="10" fill="#78350f"/>
    <rect x="20" y="130" width="310" height="14" fill="#78350f"/>
    <text x="35" y="133" fill="#fef3c7" font-size="13" font-weight="bold">SQLite: project_memories table</text>
    <text x="250" y="133" fill="#fde68a" font-size="10.5">Curated</text>

    <!-- Table Fields -->
    <text x="35" y="165" fill="#fde68a" font-size="11 font-mono">memory_type: "architecture_decision"</text>
    <text x="35" y="185" fill="#fde68a" font-size="11 font-mono">key: "auth_strategy", "orm_choice"...</text>
    <text x="35" y="205" fill="#cbd5e1" font-size="11 font-mono">content: "Use JWT + bcrypt; Pydantic v2"</text>
    <text x="35" y="225" fill="#94a3b8" font-size="11 font-mono">importance: 0.85  •  is_active: true</text>
    <text x="35" y="248" fill="#34d399" font-size="10.5">✓ 100% Curated, high-value knowledge</text>

    <!-- Key Characteristics Card -->
    <rect x="20" y="275" width="310" height="205" rx="10" fill="#1c1608" stroke="#78350f" stroke-width="1"/>
    <text x="35" y="302" fill="#fef3c7" font-size="13" font-weight="bold">Extraction &amp; Persistence</text>
    <line x1="35" y1="312" x2="310" y2="312" stroke="#78350f" stroke-width="1"/>
    
    <text x="35" y="336" fill="#fde68a" font-size="11.5">• Trivial noise filter rejects junk/greetings</text>
    <text x="35" y="360" fill="#fde68a" font-size="11.5">• Agent writes notes via save_memory tool</text>
    <text x="35" y="384" fill="#fde68a" font-size="11.5">• Structured categories: rules, conventions, facts</text>
    <text x="35" y="408" fill="#fde68a" font-size="11.5">• Shared automatically with all teammates</text>

    <!-- Badge -->
    <rect x="35" y="432" width="280" height="34" rx="6" fill="#2a1e05" stroke="#f59e0b" stroke-width="1"/>
    <text x="175" y="453" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Permanent Cross-Session Memory</text>
  </g>

  <!-- ================= COLUMN 3: PROMPT CONTEXT ASSEMBLY (THE FUSION) ================= -->
  <g transform="translate(810, 110)">
    <rect x="0" y="0" width="345" height="495" rx="14" fill="url(#fusionGrad)" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="0" y="0" width="345" height="50" rx="14" fill="#047857"/>
    <rect x="0" y="30" width="345" height="20" fill="#047857"/>
    <text x="172" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">CONTEXT FUSION &amp; PROMPT</text>

    <!-- Scope Tag -->
    <rect x="25" y="65" width="295" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="172" y="85" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="middle">Final Prompt Injected into LLM</text>

    <!-- Fusion Formula Box -->
    <rect x="20" y="110" width="305" height="200" rx="10" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
    <text x="172" y="135" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">Unified LLM Context Window</text>
    <line x1="35" y1="145" x2="310" y2="145" stroke="#065f46" stroke-width="1"/>

    <!-- Ingredient 1 -->
    <rect x="30" y="155" width="285" height="36" rx="6" fill="#0f291e" stroke="#f59e0b" stroke-width="1"/>
    <text x="40" y="177" fill="#fbbf24" font-size="11">📌 All Active Project Memories (100%)</text>

    <!-- Ingredient 2 -->
    <rect x="30" y="200" width="285" height="36" rx="6" fill="#0f291e" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="222" fill="#38bdf8" font-size="11">💬 Recent Chat History (Sliding Window)</text>

    <!-- Ingredient 3 -->
    <rect x="30" y="245" width="285" height="36" rx="6" fill="#0f291e" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="267" fill="#34d399" font-size="11">📂 Top-4 Scored Code Files (200 lines max)</text>

    <!-- Benefit Card -->
    <rect x="20" y="325" width="305" height="155" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
    <text x="35" y="352" fill="#ecfdf5" font-size="13" font-weight="bold">The Resulting Superpower</text>
    <line x1="35" y1="363" x2="310" y2="363" stroke="#334155" stroke-width="1"/>
    <text x="35" y="388" fill="#a7f3d0" font-size="11.5">✓ No manual re-explaining needed</text>
    <text x="35" y="412" fill="#a7f3d0" font-size="11.5">✓ Zero vector DB latency / zero cost</text>
    <text x="35" y="436" fill="#a7f3d0" font-size="11.5">✓ AI adheres to team standards forever</text>
    <text x="35" y="460" fill="#6ee7b7" font-size="11" font-weight="bold">→ Consistent, team-aligned AI code</text>
  </g>

  <!-- ================= CONNECTING ARROWS ================= -->
  <!-- Arrow 1: Ephemeral -> Fusion -->
  <path d="M 390 300 Q 785 240 805 240" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowRight)"/>
  
  <!-- Arrow 2: Persistent -> Fusion -->
  <line x1="775" y1="300" x2="805" y2="300" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- ================= BOTTOM BANNER ================= -->
  <rect x="45" y="620" width="1110" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="644" fill="#cbd5e1" font-size="12.5" text-anchor="middle">
    <tspan fill="#fbbf24" font-weight="bold">Core Architectural Innovation:</tspan> Chat is temporary, but architectural decisions are eternal. Summit guarantees the agent never forgets team standards.
  </text>
</svg>

</body>
</html>
